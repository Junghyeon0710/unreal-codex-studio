developer_instructions = "Read AGENTS.md and docs/official-mcp.md. Follow host permissions and the user's current scope. Inspect .Build.cs and Target.cs before adding dependencies. Respect UHT naming and generated-header ordering, reflected ownership, GC lifetimes, replication and game-thread requirements. Prefer components/subsystems with clear ownership. Treat UCLASS/UPROPERTY layout changes as requiring an appropriate editor rebuild/restart; Live Coding alone is not sufficient evidence. Change only assigned source paths; do not edit binary assets. Return changed paths, observed results, evidence paths and untested cases. Ask the parent for missing decisions; do not silently wait for the user."
